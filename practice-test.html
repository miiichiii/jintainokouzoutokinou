    const PRACTICE_QUESTION_COUNT = 60;
    let quizData = [];
    let currentQuestion = 0;
    let score = 0;
    let userAnswers = [];
    let shuffledOptions = [];

    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildPracticeSet() {
      quizData = shuffleArray(allQuizData).slice(0, Math.min(PRACTICE_QUESTION_COUNT, allQuizData.length));
    }

    function loadQuestion() {
      const question = quizData[currentQuestion];
      document.getElementById('progress').textContent = `問題 ${currentQuestion + 1} / ${quizData.length}`;
      document.getElementById('question').textContent = question.question;
      shuffledOptions = shuffleArray(question.options.map((text, originalIndex) => ({ text, originalIndex })));
      document.getElementById('options').innerHTML = shuffledOptions.map((option, index) => `
        <div class="option" onclick="selectOption(${index})">${option.text}</div>
      `).join('');
      const explanationEl = document.getElementById('explanation');
      explanationEl.style.opacity = '0';
      explanationEl.style.display = 'none';
      explanationEl.innerHTML = '';
      document.getElementById('next').textContent = currentQuestion < quizData.length - 1 ? '次の問題' : '結果を見る';
    }

    function selectOption(index) {
      const options = document.querySelectorAll('.option');
      if (options[index].classList.contains('disabled')) return;
      options.forEach(option => option.classList.add('disabled'));
      options[index].classList.add('selected');

      const question = quizData[currentQuestion];
      const selectedAnswer = shuffledOptions[index].originalIndex;
      userAnswers[currentQuestion] = selectedAnswer;
      options.forEach((option, i) => {
        const originalIndex = shuffledOptions[i].originalIndex;
        if (originalIndex === question.answer) option.classList.add('correct');
        else if (i === index) option.classList.add('incorrect');
      });

      const explanationEl = document.getElementById('explanation');
      explanationEl.innerHTML = `<div class="source">出典: ${question.sourceTitle} 確認テスト</div>${question.explanation}`;
      explanationEl.style.display = 'block';
      setTimeout(() => { explanationEl.style.opacity = '1'; }, 100);
    }

    function nextQuestion() {
      if (currentQuestion < quizData.length - 1) {
        currentQuestion++;
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      score = userAnswers.reduce((total, answer, index) => total + (answer === quizData[index].answer ? 1 : 0), 0);
      const resultContainer = document.getElementById('result-container');
      document.getElementById('quiz-container').style.display = 'none';
      const percentage = (score / quizData.length) * 100;
      let resultHtml = `
        <div class="summary">
          <h2>練習結果</h2>
          <p>正解数: <strong>${score} / ${quizData.length}</strong></p>
          <p>正答率: <strong>${percentage.toFixed(1)}%</strong></p>
          <p>このページは練習用です。結果は保存されません。間違えた問題の解説を確認してから、もう一度挑戦できます。</p>
        </div>
      `;

      quizData.forEach((question, index) => {
        const isCorrect = userAnswers[index] === question.answer;
        const selectedText = Number.isInteger(userAnswers[index]) ? question.options[userAnswers[index]] : '未回答';
        resultHtml += `
          <div class="result-card">
            <div class="source">問題 ${index + 1} / 出典: ${question.sourceTitle} 確認テスト</div>
            <p class="result-status ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? '正解' : '不正解'}</p>
            <p><strong>質問:</strong> ${question.question}</p>
            <p><strong>あなたの回答:</strong> ${selectedText}</p>
            <p><strong>正解:</strong> ${question.options[question.answer]}</p>
            <p><strong>説明:</strong> ${question.explanation}</p>
          </div>
        `;
      });

      resultHtml += '<button class="nav-button" onclick="restartQuiz()">別の60問でもう一度挑戦する</button>';
      resultHtml += '<button class="nav-button secondary" onclick="goToTopPage()">トップページに戻る</button>';
      resultContainer.innerHTML = resultHtml;
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      userAnswers = [];
      shuffledOptions = [];
      buildPracticeSet();
      document.getElementById('quiz-container').style.display = 'block';
      document.getElementById('result-container').innerHTML = '';
      loadQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToTopPage() {
      window.location.href = 'index.html';
    }

    buildPracticeSet();
    loadQuestion();
  </script>
